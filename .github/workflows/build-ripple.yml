
name: Publish Ezis Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefix ripple-src

      - name: Build React website
        run: npm run build --prefix ripple-src

      - name: Publish homepage
        run: |
          cp ripple-src/dist/index.html ./index.html
          mkdir -p assets
          cp -a ripple-src/dist/assets/. assets/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Ezis React homepage"
            git push
          fi
