
name: Build Ripple preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefix ripple-src

      - name: Build React preview
        run: npm run build --prefix ripple-src

      - name: Publish preview
        run: |
          mkdir -p ripple
          cp -a ripple-src/dist/. ripple/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ripple
          if ! git diff --cached --quiet; then
            git commit -m "Publish React ripple preview"
            git push
          fi
