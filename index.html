<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ezis — Entering the World</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f5ef;
      color: #171717;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 5vw, 70px);
    }
    .top, .bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      letter-spacing: .06em;
    }
    .center { text-align: center; }
    h1 {
      font-size: clamp(100px, 22vw, 350px);
      font-weight: 500;
      letter-spacing: -.105em;
      line-height: .9;
      margin: 0 0 30px;
      padding-right: .1em;
    }
    .subtitle {
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .message {
      font-size: 15px;
      margin-top: 55px;
      line-height: 1.8;
    }
    a { color: inherit; }
    @media(max-width: 600px) {
      .top, .bottom { font-size: 10px; }
      .bottom { align-items: flex-end; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <span>20.09.2026</span>
      <span>06:13 — EARTH</span>
    </header>

    <section class="center">
      <h1>Ezis</h1>
      <div class="subtitle">Entering the World</div>
      <div class="message">
        The world,<br>
        slightly rearranged.
      </div>
    </section>

    <footer class="bottom">
      <span>GUNST VAN DAELE</span>
      <span>A NEW PRESENCE<br>EST. 2026</span>
    </footer>
  </main>
</body>
</html>
